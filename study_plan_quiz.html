<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Find Your Child's Study Plan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper: #EFE4C6;
    --paper-dark: #E3D3AC;
    --ink: #2B2B2B;
    --ink-soft: #55503f;
    --red-pen: #C23B22;
    --blue-pen: #2B4C7E;
    --green-pen: #2F6B4F;
    --highlight: #F2C230;
    --card-shadow: rgba(43,43,43,0.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.25), transparent 40%),
      var(--paper);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
    color:var(--ink);
  }

  .folder-wrap{
    width:100%;
    max-width:480px;
    position:relative;
  }

  .tabs{
    display:flex;
    gap:6px;
    padding-left:18px;
  }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    background:var(--paper-dark);
    border:2px solid var(--ink);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    padding:6px 12px 8px;
    transform:translateY(2px);
    opacity:0.55;
    transition:opacity 0.35s ease, transform 0.35s ease, background 0.35s ease;
  }
  .tab.active{
    opacity:1;
    background:var(--highlight);
    transform:translateY(0);
  }
  .tab.done{
    opacity:0.85;
    background:#cfe3d4;
  }

  .card{
    background:var(--paper-dark);
    border:2px solid var(--ink);
    border-radius:4px 14px 14px 14px;
    box-shadow:6px 8px 0 var(--card-shadow);
    padding:32px 26px 28px;
    position:relative;
    overflow:hidden;
  }

  .card::before{
    content:'';
    position:absolute;
    top:0; left:44px;
    width:2px; height:100%;
    background:repeating-linear-gradient(var(--red-pen), var(--red-pen) 6px, transparent 6px, transparent 12px);
    opacity:0.18;
  }

  .logo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 16px;
  }
  .logo-row img{
    height:38px;
    width:auto;
    display:block;
  }
  .logo-row span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--blue-pen);
    margin:0 0 6px;
  }

  h1{
    font-family:'Kalam', cursive;
    font-size:28px;
    line-height:1.15;
    margin:0 0 4px;
    color:var(--ink);
  }

  .sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 22px;
  }

  .screen{ display:none; }
  .screen.active{ display:block; animation: fadeSlide 0.4s ease; }

  @keyframes fadeSlide{
    from{ opacity:0; transform: translateX(14px); }
    to{ opacity:1; transform: translateX(0); }
  }

  .question{
    font-family:'Kalam', cursive;
    font-size:20px;
    margin:0 0 16px;
    color:var(--ink);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .opt{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    text-align:left;
    padding:13px 16px;
    border:2px solid var(--ink);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    box-shadow:3px 3px 0 rgba(43,43,43,0.18);
  }
  .opt:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(43,43,43,0.25); }
  .opt:active{ transform:translate(1px,1px); box-shadow:1px 1px 0 rgba(43,43,43,0.25); }
  .opt.selected{ background:var(--highlight); }

  .other-row{
    display:none;
    gap:8px;
    margin-top:10px;
  }
  .other-row.visible{ display:flex; }
  .other-input{
    flex:1;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    padding:11px 12px;
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
  }
  .other-input:focus{ outline:2px solid var(--blue-pen); outline-offset:1px; }
  .other-continue{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
    padding:0 14px;
    border:2px solid var(--ink);
    border-radius:8px;
    background:var(--highlight);
    color:var(--ink);
    cursor:pointer;
  }
  .other-continue:disabled{ opacity:0.4; cursor:not-allowed; }

  .back-row{
    margin-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .back-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    text-decoration:underline;
    padding:4px 0;
  }
  .back-btn:disabled{ visibility:hidden; }

  .progress-dots{ display:flex; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-soft); opacity:0.3; }
  .dot.filled{ opacity:1; background:var(--blue-pen); }

  /* Result screen */
  .stamp-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding-top:6px;
  }
  .stamp{
    font-family:'Kalam', cursive;
    font-weight:700;
    font-size:22px;
    color:var(--green-pen);
    border:4px solid var(--green-pen);
    border-radius:10px;
    padding:8px 22px;
    transform: rotate(-6deg) scale(0.6);
    opacity:0;
    letter-spacing:0.06em;
    margin-bottom:18px;
  }
  .stamp.show{
    animation: stampIn 0.5s cubic-bezier(.2,1.4,.5,1) forwards;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform: rotate(-6deg) scale(1.8); }
    60%{ opacity:1; transform: rotate(-6deg) scale(0.92); }
    100%{ opacity:1; transform: rotate(-6deg) scale(1); }
  }

  .result-text{
    font-size:15px;
    line-height:1.55;
    color:var(--ink);
    margin:0 0 22px;
  }
  .result-text b{ color:var(--blue-pen); }

  .wa-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
    background:var(--green-pen);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    box-shadow:3px 3px 0 rgba(43,43,43,0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-decoration:none;
  }
  .wa-btn:hover{ transform:translate(-1px,-1px); box-shadow:4px 4px 0 rgba(43,43,43,0.3); }
  .wa-btn svg{ width:18px; height:18px; flex-shrink:0; }

  .restart{
    display:block;
    text-align:center;
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
  }

  .site-footer{
    text-align:center;
    margin-top:14px;
  }
  .site-footer a{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--blue-pen);
    text-decoration:none;
    border-bottom:1px solid var(--blue-pen);
    padding-bottom:1px;
  }
  .site-footer a:hover{ opacity:0.75; }

  @media (prefers-reduced-motion: reduce){
    .screen.active, .stamp.show, .opt{ animation:none !important; transition:none !important; }
  }
</style>
</head>

    <p class="sub" id="mainSub">Answer 3 quick questions — takes 15 seconds.</p>

    <!-- Screen 0 -->
    <div class="screen active" data-screen="0">
      <p class="question">Which grade is your child in?</p>
      <div class="options" data-q="grade">
        <button class="opt" data-value="K-5">K-5</button>
        <button class="opt" data-value="6-9">6-9</button>
        <button class="opt" data-value="10-12">10-12</button>
        <button class="opt" data-value="College level">College level</button>
      </div>
      <div class="back-row">
        <button class="back-btn" disabled>← Back</button>
        <div class="progress-dots">
          <span class="dot filled"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Screen 1 -->
    <div class="screen" data-screen="1">
      <p class="question">Which subject needs the most help?</p>
      <div class="options" data-q="subject">
        <button class="opt" data-value="Maths">Maths</button>
        <button class="opt" data-value="Science">Science</button>
        <button class="opt" data-value="English">English</button>
        <button class="opt opt-other" data-value="__other__">Other</button>
      </div>
      <div class="other-row" data-other-for="subject">
        <input type="text" class="other-input" placeholder="Type the subject...">
        <button class="other-continue">Continue →</button>
      </div>
      <div class="back-row">
        <button class="back-btn">← Back</button>
        <div class="progress-dots">
          <span class="dot filled"></span><span class="dot filled"></span><span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Screen 2 -->
    <div class="screen" data-screen="2">
      <p class="question">Which country are you in?</p>
      <div class="options" data-q="country">
        <button class="opt" data-value="USA">USA</button>
        <button class="opt" data-value="UK">UK</button>
        <button class="opt" data-value="UAE">UAE</button>
        <button class="opt" data-value="Singapore">Singapore</button>
        <button class="opt opt-other" data-value="__other__">Other</button>
      </div>
      <div class="other-row" data-other-for="country">
        <input type="text" class="other-input" placeholder="Type your country...">
        <button class="other-continue">Continue →</button>
      </div>
      <div class="back-row">
        <button class="back-btn">← Back</button>
        <div class="progress-dots">
          <span class="dot filled"></span><span class="dot filled"></span><span class="dot filled"></span>
        </div>
      </div>
    </div>

    <!-- Screen 3: Result -->
    <div class="screen" data-screen="3">
      <div class="stamp-zone">
        <div class="stamp" id="stampEl">PLAN READY</div>
        <p class="result-text" id="resultText"></p>
        <a class="wa-btn" id="waBtn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.3-1.39a9.9 9.9 0 0 0 4.69 1.19h.01c5.46 0 9.9-4.45 9.9-9.9 0-2.65-1.03-5.13-2.9-7C17.18 3.03 14.69 2 12.04 2m0 1.67c2.2 0 4.27.86 5.82 2.42a8.2 8.2 0 0 1 2.42 5.82c0 4.55-3.7 8.24-8.24 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.14.82.84-3.06-.2-.32a8.18 8.18 0 0 1-1.26-4.37c0-4.55 3.7-8.22 8.25-8.22m-4.53 4.7c-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02s.87 2.35.99 2.51c.12.16 1.7 2.6 4.13 3.64.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28-.24-.12-1.44-.71-1.66-.79-.22-.08-.38-.12-.55.12-.16.24-.63.79-.77.95-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.19-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.35-.76-1.84-.2-.48-.4-.42-.55-.42h-.42z"/></svg>
          <span>Book a free demo class now</span>
        </a>
      </div>
      <button class="restart" id="restartBtn">↺ Start over</button>
    </div>

  </div>

  <div class="site-footer">
    <a href="https://www.smartclass247.com/" target="_blank" rel="noopener">smartclass247.com</a>
  </div>
</div>

<script>
  const WHATSAPP_NUMBER = "919817861570";

  const answers = { grade: null, subject: null, country: null };
  let current = 0;
  const totalQuestions = 3;

  const screens = document.querySelectorAll('.screen');
  const tabs = document.querySelectorAll('.tab');
  const mainHeading = document.getElementById('mainHeading');
  const mainSub = document.getElementById('mainSub');

  function showScreen(idx){
    screens.forEach(s => s.classList.toggle('active', Number(s.dataset.screen) === idx));
    tabs.forEach((t, i) => {
      t.classList.toggle('active', i === idx);
      t.classList.toggle('done', i < idx);
    });
    if(idx < totalQuestions){
      mainHeading.textContent = "Find your child's study plan";
      mainSub.textContent = "Answer 3 quick questions — takes 15 seconds.";
    } else {
      mainHeading.textContent = "Here's what we'd recommend";
      mainSub.textContent = "Based on your answers.";
      buildResult();
    }
  }

  function advance(){
    setTimeout(() => {
      current = Math.min(current + 1, totalQuestions);
      showScreen(current);
    }, 220);
  }

  document.querySelectorAll('.options').forEach(group => {
    const key = group.dataset.q;
    const otherRow = document.querySelector(`.other-row[data-other-for="${key}"]`);

    group.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');

        if(btn.dataset.value === '__other__'){
          if(otherRow){
            otherRow.classList.add('visible');
            const input = otherRow.querySelector('.other-input');
            input.value = '';
            input.focus();
          }
          return; // wait for the person to type and hit Continue
        }

        if(otherRow) otherRow.classList.remove('visible');
        answers[key] = btn.dataset.value;
        advance();
      });
    });

    if(otherRow){
      const input = otherRow.querySelector('.other-input');
      const continueBtn = otherRow.querySelector('.other-continue');
      const submitOther = () => {
        const val = input.value.trim();
        if(!val) { input.focus(); return; }
        answers[key] = val;
        advance();
      };
      continueBtn.addEventListener('click', submitOther);
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') submitOther();
      });
    }
  });

  document.querySelectorAll('.back-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      current = Math.max(current - 1, 0);
      showScreen(current);
    });
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    answers.grade = answers.subject = answers.country = null;
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.other-row').forEach(r => r.classList.remove('visible'));
    document.getElementById('stampEl').classList.remove('show');
    current = 0;
    showScreen(0);
  });

  function buildResult(){
    const { grade, subject, country } = answers;

    document.getElementById('resultText').innerHTML =
      `For a child in <b>${grade}</b> needing help with <b>${subject}</b>, based in <b>${country}</b> — ` +
      `we'd recommend a personalised study plan built around that exact combination. Tap below and we'll get in touch directly on WhatsApp.`;

    const stamp = document.getElementById('stampEl');
    stamp.classList.remove('show');
    void stamp.offsetWidth; // restart animation
    stamp.classList.add('show');

    const message =
`Hi SmartClass 247! I just did the Study Plan quiz for my child.

Grade: ${grade}
Subject needing help: ${subject}
Country: ${country}

Could you arrange a free demo for us?`;

    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    document.getElementById('waBtn').setAttribute('href', waLink);
  }

  showScreen(0);
</script>

</body>
</html>
